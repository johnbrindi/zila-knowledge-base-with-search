services:
  api:
    build: .
    image: rag-ingest:latest
    ports: ["8000:8000"]
    env_file: .env
    environment: &env
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      UPLOAD_DIR: /data/uploads
    volumes: [uploads:/data/uploads]
    depends_on: [redis, qdrant]
    restart: unless-stopped

  # Document ingestion (default queue)
  worker:
    image: rag-ingest:latest
    command: celery -A app.worker.celery_app.celery worker --loglevel=info --concurrency=2 -Q celery
    env_file: .env
    environment: *env
    volumes: [uploads:/data/uploads]
    depends_on: [api, redis, qdrant]
    restart: unless-stopped

  # Weekly opportunity digest jobs (separate queue so they never block uploads)
  digest-worker:
    image: rag-ingest:latest
    command: celery -A app.worker.celery_app.celery worker --loglevel=info --concurrency=2 -Q digest -n digest@%h
    env_file: .env
    environment: *env
    depends_on: [api, redis]
    restart: unless-stopped

  # The cron. Run exactly ONE beat instance; never scale this service.
  beat:
    image: rag-ingest:latest
    command: celery -A app.worker.celery_app.celery beat --loglevel=info --schedule /tmp/celerybeat-schedule
    env_file: .env
    environment: *env
    depends_on: [api, redis]
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes
    volumes: [redisdata:/data]
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.19.2
    ports: ["6333:6333"]
    volumes: [qdrantdata:/qdrant/storage]
    restart: unless-stopped

volumes:
  uploads:
  redisdata:
  qdrantdata:
