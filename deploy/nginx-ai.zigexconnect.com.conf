# Zila AI service - ai.zigexconnect.com
# Install: /etc/nginx/sites-available/ai.zigexconnect.com, symlink into sites-enabled,
# `nginx -t && systemctl reload nginx`, then `certbot --nginx -d ai.zigexconnect.com`.
server {
    listen 80;
    listen [::]:80;
    server_name ai.zigexconnect.com;

    access_log /var/log/nginx/ai.zigexconnect.com-access.log;
    error_log /var/log/nginx/ai.zigexconnect.com-error.log;

    # Course uploads are limited to 50 MB by the app (MAX_UPLOAD_MB)
    client_max_body_size 60M;

    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # /v1/digests/preview makes live searches and LLM calls (30 to 90 s)
        proxy_connect_timeout 60s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
    }
}
